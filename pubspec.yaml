name: flutter_crud_app
description: Flutter multi-screen app with REST API CRUD operations, offline caching, and Provider state management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.0.0            # state management
  shared_preferences: ^2.0.0 # local storage (offline cache)

flutter:
  uses-material-design: true
